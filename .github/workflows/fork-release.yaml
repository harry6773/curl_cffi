name: Fork release
run-name: Fork release ${{ github.ref_name }}

# Builds wheels for this fork and attaches them to a GitHub Release.
# Push a tag like `fork-1`; the wheel version becomes `<pyproject version>+fork.1`.
# Nothing is published to PyPI.
on:
  push:
    tags:
      - fork-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bdist:
    name: Build wheels (${{ matrix.os }} ${{ matrix.cibw_archs_linux }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          cibw_archs_linux: "x86_64"
        - os: ubuntu-24.04-arm
          cibw_archs_linux: "aarch64"
        - os: macos-15-intel
        - os: macos-14
        - os: windows-2022
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Set fork version
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/fork-') }}
      run: |
        if [ "$IS_TAG" = "true" ]; then
          suffix="fork.${REF_NAME#fork-}"
        else
          suffix="fork.dev${{ github.run_number }}"
        fi
        python - "$suffix" <<'EOF'
        import re, sys
        text = open("pyproject.toml").read()
        text, n = re.subn(
            r'^version = "([^"+]+)"',
            lambda m: f'version = "{m.group(1)}+{sys.argv[1]}"',
            text,
            count=1,
            flags=re.M,
        )
        assert n == 1, "version line not found"
        open("pyproject.toml", "w").write(text)
        EOF
        grep -m1 '^version' pyproject.toml

    # macOS make is too old
    - if: runner.os == 'macOS'
      run: |
        brew install make automake libtool

    - name: Build and test wheels
      uses: pypa/cibuildwheel@v3.3.1
      env:
        CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/fork-')
    needs: bdist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Upload wheels to release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        ls -l dist
        gh release create "$TAG" dist/*.whl \
          --repo "${{ github.repository }}" \
          --title "$TAG" \
          --notes "Wheels built from $(echo ${{ github.sha }} | cut -c1-7). Install with:
        pip install curl_cffi --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/$TAG"
